[package]
name = "studio-native"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "3", features = ["napi9", "async", "serde-json", "tokio_rt"] }
napi-derive = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-screen-capture-kit = "0.3"
objc2-av-foundation = { version = "0.3", features = ["objc2-core-media"] }
objc2-avf-audio = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-core-graphics = "0.3"
objc2-core-foundation = "0.3"
objc2-core-audio-types = "0.3"
objc2-vision = "0.3"
block2 = "0.6"
dispatch2 = "0.3"
parakeet-rs = "0.3.8"
# DeepFilterNet3 voice cleaning (MIT/Apache-2.0) on tract, model embedded; crates.io stops at 0.2.
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", rev = "978576aa8400552a4ce9730838c635aa30db5e61", default-features = false, features = ["tract", "default-model"] }
ndarray = "0.15"
# Silero VAD runs on the ONNX Runtime parakeet-rs already links (same version: one copy).
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = "thin"
# Apple's strip (run for the default "debuginfo") can leave a LINKEDIT string pool dyld rejects on macOS 27.
strip = "none"
