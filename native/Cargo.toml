[package]
name = "studio-native"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "3", features = ["napi9", "async", "serde-json", "tokio_rt"] }
napi-derive = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-screen-capture-kit = "0.3"
objc2-av-foundation = { version = "0.3", features = ["objc2-core-media"] }
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-core-graphics = "0.3"
objc2-core-foundation = "0.3"
objc2-vision = "0.3"
block2 = "0.6"
dispatch2 = "0.3"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = "thin"
# The default strip ("debuginfo") runs /usr/bin/strip, which can leave a 4-byte aligned symbol
# string table that macOS 27 dyld refuses to load ("mis-aligned LINKEDIT string pool").
strip = false
