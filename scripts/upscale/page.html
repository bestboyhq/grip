<!doctype html>
<!-- A random screen of UI for the upscaler's training pages (make.ts): sidebars, toolbars, code, tables,
     forms, menus, chat, and documents in the system's fonts, light and dark, packed edge to edge.
     Every length is whole CSS px, so the page lays out the same at every pixel density. -->
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; -webkit-font-smoothing: auto; }
  .leaf { position: absolute; overflow: hidden; }
  svg { display: inline-block; vertical-align: middle; flex: none; }
</style>
</head>
<body>
<script>
function build({ seed, words, code, width, height }) {
  let s = seed >>> 0 || 1
  const rnd = () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296)
  const int = (a, b) => a + Math.floor(rnd() * (b - a + 1))
  const pick = (a) => a[Math.floor(rnd() * a.length)]
  const chance = (p) => rnd() < p
  const SANS = ['system-ui', '-apple-system', 'Helvetica Neue', 'Helvetica', 'Arial', 'Avenir Next', 'Verdana', 'Gill Sans', 'Futura', 'Trebuchet MS']
  const SERIF = ['Georgia', 'Times New Roman', 'Charter', 'Palatino', 'Baskerville', 'Iowan Old Style']
  const MONO = ['ui-monospace', 'Menlo', 'Monaco', 'Courier New', 'SF Mono']
  const LABELS = ['File', 'Edit', 'View', 'Window', 'Help', 'Settings', 'Share', 'Export', 'Cancel', 'Save', 'Done', 'Open', 'New Project',
    'Search', 'Inbox', 'Drafts', 'Archive', 'Trash', 'Favorites', 'Recents', 'Downloads', 'Applications', 'Desktop', 'Documents', 'Library',
    'Account', 'Billing', 'Members', 'Invite', 'Delete', 'Rename', 'Duplicate', 'Move to…', 'Get Info', 'Preferences…', 'Sign Out', 'Upgrade',
    'Overview', 'Analytics', 'Reports', 'Customers', 'Orders', 'Products', 'Deploy', 'Logs', 'Branches', 'Pull requests', 'Issues', 'Commits']
  const KEYS = ['⌘S', '⌘O', '⇧⌘N', '⌥⌘I', '⌘W', '⌘,', '⌃⌘F', '⌘Z', '⇧⌘Z', '⌘C', '⌘V', '⌘K', '⌘↩', '⌫']
  const EMOJI = ['😀', '🎉', '🚀', '✅', '⚠️', '📁', '🔥', '👍', '💬', '⭐️', '🎬', '📌']
  const word = () => pick(words)
  const cap = (w) => w[0].toUpperCase() + w.slice(1)
  const sentence = (n) => cap(Array.from({ length: n }, word).join(' ')) + pick(['.', '.', '.', '?', '!', ':', ','])
  const text = (n) => Array.from({ length: n }, () => sentence(int(4, 14))).join(' ')
  const token = () => pick([word(), cap(word()), String(int(0, 99999)), `${int(1, 28)}/${int(1, 12)}/${int(20, 26)}`, `${word()}@${word()}.com`,
    `$${int(1, 9999)}.${int(10, 99)}`, `${int(0, 23)}:${String(int(0, 59)).padStart(2, '0')}`, `${int(1, 100)}%`, `#${int(100, 9999)}`, word().toUpperCase()])

  const dark = chance(0.45)
  const hue = int(0, 359)
  const accent = `hsl(${hue} ${int(55, 95)}% ${int(42, 60)}%)`
  const bgs = dark ? ['#000', '#1c1c1e', '#1e1e1e', '#232326', '#2b2b2b', '#161b22', '#0d1117', '#202124'] : ['#fff', '#fff', '#f5f5f7', '#fafafa', '#f2f2f7', '#ececec', '#f6f8fa', '#fffdf7']
  const fgs = dark ? ['#fff', '#f5f5f7', '#e6edf3', '#d4d4d4', '#c9d1d9', '#ababab', '#8b949e'] : ['#000', '#1d1d1f', '#24292f', '#333', '#3c3c43', '#57606a', '#6e6e73', '#8e8e93']
  const fg = () => pick(fgs)
  const bg = () => pick(bgs)
  const line = dark ? pick(['#38383a', '#30363d', '#3a3a3c', '#444']) : pick(['#d1d1d6', '#d0d7de', '#e5e5ea', '#c6c6c8'])
  const tint = () => `hsl(${(hue + int(-60, 60) + 360) % 360} ${int(40, 90)}% ${dark ? int(55, 75) : int(30, 50)}%)`

  const el = (tag, css, parent, html) => {
    const e = document.createElement(tag)
    if (css) e.style.cssText = css
    if (html !== undefined) e.textContent = html
    if (parent) parent.appendChild(e)
    return e
  }
  const font = (fam, size, weight = 400) => `font-family: ${fam.includes(' ') || fam.includes('-') ? `"${fam}"` : fam}, system-ui; font-size: ${size}px; font-weight: ${weight};`
  const sans = () => pick(SANS)
  const icon = (size, color) => {
    const n = int(0, 6)
    const c = color ?? tint()
    const sw = pick([1, 1.5, 2])
    const shapes = [
      `<circle cx="12" cy="12" r="8" fill="none" stroke="${c}" stroke-width="${sw}"/>`,
      `<rect x="4" y="5" width="16" height="14" rx="3" fill="none" stroke="${c}" stroke-width="${sw}"/><path d="M4 9h16" stroke="${c}" stroke-width="${sw}"/>`,
      `<path d="M3 7h7l2 2h9v10H3z" fill="${c}"/>`,
      `<path d="M5 12l4 4 10-10" fill="none" stroke="${c}" stroke-width="${sw + 0.5}" stroke-linecap="round" stroke-linejoin="round"/>`,
      `<circle cx="11" cy="11" r="6" fill="none" stroke="${c}" stroke-width="${sw}"/><path d="M15.5 15.5L20 20" stroke="${c}" stroke-width="${sw}" stroke-linecap="round"/>`,
      `<path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z" fill="${c}"/>`,
      `<path d="M4 6h16M4 12h16M4 18h10" stroke="${c}" stroke-width="${sw}" stroke-linecap="round"/>`,
    ]
    return `<svg width="${size}" height="${size}" viewBox="0 0 24 24">${shapes[n]}</svg>`
  }

  // Widgets, each filling its own box.
  const W = {
    paragraph(b) {
      const serif = chance(0.25)
      const size = int(10, 18)
      b.style.cssText += `padding: ${int(6, 24)}px; background: ${bg()}; color: ${fg()}; ${font(serif ? pick(SERIF) : sans(), size, pick([400, 400, 500]))} line-height: ${Math.round(size * (1.25 + rnd() * 0.4))}px;`
      if (chance(0.5)) el('div', font(serif ? pick(SERIF) : sans(), int(size + 4, 30), pick([600, 700, 800])) + `margin-bottom: ${int(4, 12)}px; color: ${fg()};`, b, sentence(int(2, 6)).slice(0, -1))
      for (let i = int(1, 4); i > 0; i--) {
        const p = el('p', `margin-bottom: ${int(4, 14)}px;`, b)
        const parts = text(int(1, 4)).split(' ')
        for (const w of parts) {
          if (chance(0.06)) el('a', `color: ${accent}; text-decoration: ${chance(0.5) ? 'underline' : 'none'};`, p, w)
          else if (chance(0.04)) el('b', '', p, w)
          else if (chance(0.03)) el('i', '', p, w)
          else if (chance(0.03)) el('code', font(pick(MONO), size - 1) + `background: ${dark ? '#ffffff1a' : '#0000000d'}; padding: 1px 4px; border-radius: 4px;`, p, w)
          else p.append(w)
          p.append(' ')
        }
      }
    },
    sidebar(b) {
      const size = int(11, 15)
      const row = Math.round(size * (1.7 + rnd() * 0.6))
      b.style.cssText += `padding: ${int(6, 14)}px ${int(4, 10)}px; background: ${bg()}; ${font(sans(), size)} border-right: 1px solid ${line};`
      const sel = int(0, 6)
      for (let i = 0; i < 40; i++) {
        if (chance(0.12)) { el('div', `color: ${fg()}; opacity: 0.6; ${font(sans(), size - 2, 600)} padding: ${int(8, 12)}px 8px 4px; text-transform: ${chance(0.5) ? 'uppercase' : 'none'};`, b, pick(LABELS)); continue }
        const r = el('div', `display: flex; align-items: center; gap: ${int(6, 10)}px; height: ${row}px; padding: 0 8px; border-radius: ${int(0, 8)}px; color: ${i === sel ? '#fff' : fg()}; background: ${i === sel ? accent : 'transparent'};`, b)
        r.innerHTML = icon(Math.round(size * 1.3), i === sel ? '#fff' : undefined)
        el('span', 'flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;', r, chance(0.5) ? pick(LABELS) : cap(word()))
        if (chance(0.25)) el('span', `${font(sans(), size - 2, 500)} opacity: 0.7;`, r, String(int(1, 999)))
      }
    },
    toolbar(b) {
      const size = int(11, 14)
      b.style.cssText += `display: flex; flex-wrap: wrap; align-content: flex-start; gap: ${int(6, 12)}px; padding: ${int(6, 12)}px; background: ${bg()}; ${font(sans(), size, 500)} border-bottom: 1px solid ${line};`
      for (let i = 0; i < 30; i++) {
        const kind = int(0, 3)
        const btn = el('div', `display: flex; align-items: center; gap: 6px; height: ${int(22, 32)}px; padding: 0 ${int(8, 14)}px; border-radius: ${int(4, 16)}px;` +
          (kind === 0 ? `background: ${accent}; color: #fff;` : kind === 1 ? `border: 1px solid ${line}; color: ${fg()};` : kind === 2 ? `background: ${dark ? '#ffffff14' : '#0000000a'}; color: ${fg()};` : `color: ${accent};`), b)
        if (chance(0.5)) btn.innerHTML = icon(size + 2, kind === 0 ? '#fff' : undefined)
        el('span', 'white-space: nowrap;', btn, chance(0.15) ? pick(EMOJI) + ' ' + pick(LABELS) : pick(LABELS))
      }
    },
    code(b) {
      const size = int(10, 15)
      const lh = Math.round(size * (1.35 + rnd() * 0.3))
      const theme = dark || chance(0.5)
      const kw = theme ? ['#ff7b72', '#d2a8ff', '#79c0ff', '#ffa657', '#a5d6ff', '#7ee787', '#c586c0', '#569cd6', '#ce9178'] : ['#cf222e', '#8250df', '#0550ae', '#953800', '#0a3069', '#116329', '#af00db', '#0000ff', '#a31515']
      b.style.cssText += `padding: ${int(6, 16)}px; background: ${theme ? pick(['#0d1117', '#1e1e1e', '#282c34', '#1f1f1f', '#002b36']) : pick(['#fff', '#f6f8fa', '#fafafa'])}; color: ${theme ? '#d4d4d4' : '#24292f'}; ${font(pick(MONO), size)} line-height: ${lh}px; white-space: pre;`
      const start = int(0, Math.max(0, code.length - 80))
      const nums = chance(0.6)
      for (let i = 0; i < 70; i++) {
        const l = el('div', '', b)
        if (nums) el('span', `display: inline-block; width: ${size * 3}px; opacity: 0.45; text-align: right; margin-right: ${size}px;`, l, String(start + i + 1))
        for (const t of (code[start + i] ?? '').split(/(\s+|[(){}[\],.;:=<>"'`])/)) {
          if (!t) continue
          if (/^(const|let|function|return|if|else|for|import|export|from|await|async|new|type|interface|class)$/.test(t)) el('span', `color: ${kw[0]};`, l, t)
          else if (/^\d/.test(t)) el('span', `color: ${kw[2]};`, l, t)
          else if (/^[A-Z]/.test(t)) el('span', `color: ${kw[3]};`, l, t)
          else if (/^["'`]/.test(t)) el('span', `color: ${kw[4]};`, l, t)
          else if (chance(0.15)) el('span', `color: ${pick(kw)};`, l, t)
          else l.append(t)
        }
      }
    },
    table(b) {
      const size = int(10, 14)
      const cols = int(3, 7)
      b.style.cssText += `background: ${bg()}; color: ${fg()}; ${font(sans(), size)}`
      const t = el('table', `border-collapse: collapse; width: 100%; font-variant-numeric: ${chance(0.5) ? 'tabular-nums' : 'normal'};`, b)
      const stripe = chance(0.5)
      for (let r = 0; r < 40; r++) {
        const tr = el('tr', `height: ${int(Math.round(size * 1.8), Math.round(size * 2.6))}px; ${stripe && r % 2 ? `background: ${dark ? '#ffffff0a' : '#00000008'};` : ''} border-bottom: 1px solid ${line};`, t)
        for (let c = 0; c < cols; c++) {
          const td = el(r ? 'td' : 'th', `padding: 0 ${int(6, 12)}px; text-align: ${c && chance(0.4) ? 'right' : 'left'}; white-space: nowrap; ${r ? '' : 'font-weight: 600; opacity: 0.7;'}`, tr, r ? token() : cap(word()))
          if (r && chance(0.08)) td.innerHTML = `<span style="display:inline-block;padding:1px 6px;border-radius:9px;background:${tint()};color:#fff;font-size:${size - 2}px;font-weight:600">${pick(['Paid', 'Open', 'Done', 'Failed', 'New', 'Beta'])}</span>`
        }
      }
    },
    form(b) {
      const size = int(11, 15)
      b.style.cssText += `display: flex; flex-direction: column; gap: ${int(8, 14)}px; padding: ${int(10, 24)}px; background: ${bg()}; color: ${fg()}; ${font(sans(), size)}`
      for (let i = 0; i < 12; i++) {
        el('label', `${font(sans(), size - 1, 500)}`, b, cap(word()) + (chance(0.3) ? ' ' + word() : ''))
        const f = el('div', `display: flex; align-items: center; height: ${int(24, 36)}px; padding: 0 ${int(6, 10)}px; border: 1px solid ${chance(0.15) ? accent : line}; border-radius: ${int(3, 10)}px; background: ${dark ? '#ffffff0d' : '#fff'};`, b)
        if (chance(0.5)) el('span', 'opacity: 0.5;', f, sentence(int(2, 4)))
        else { el('span', '', f, token() + ' ' + word()); if (chance(0.3)) el('span', `display: inline-block; width: 1px; height: ${size + 3}px; background: ${accent}; margin-left: 1px;`, f) }
        if (chance(0.3)) {
          const c = el('div', 'display: flex; align-items: center; gap: 8px;', b)
          el('span', `display: inline-block; width: ${size + 2}px; height: ${size + 2}px; border-radius: ${chance(0.5) ? 4 : 99}px; ${chance(0.5) ? `background: ${accent};` : `border: 1px solid ${line};`}`, c)
          el('span', '', c, sentence(int(3, 7)))
        }
      }
    },
    menu(b) {
      const size = int(12, 14)
      b.style.cssText += `padding: ${int(8, 30)}px; background: ${bg()}; ${font(sans(), size)}`
      const m = el('div', `width: ${int(160, 320)}px; padding: 5px; border-radius: ${int(6, 12)}px; background: ${dark ? '#2c2c2e' : '#fff'}; color: ${fg()}; border: 1px solid ${line}; box-shadow: 0 ${int(4, 12)}px ${int(12, 40)}px #0000004d;`, b)
      const sel = int(0, 8)
      for (let i = 0; i < 16; i++) {
        if (chance(0.15)) { el('div', `height: 1px; margin: 5px 8px; background: ${line};`, m); continue }
        const r = el('div', `display: flex; justify-content: space-between; gap: 20px; padding: ${int(3, 6)}px 10px; border-radius: 5px; ${i === sel ? `background: ${accent}; color: #fff;` : ''}`, m)
        el('span', '', r, pick(LABELS))
        if (chance(0.5)) el('span', 'opacity: 0.6;', r, pick(KEYS))
      }
    },
    tabs(b) {
      const size = int(11, 15)
      b.style.cssText += `background: ${bg()}; color: ${fg()}; ${font(sans(), size, 500)}`
      const bar = el('div', `display: flex; gap: ${int(12, 24)}px; padding: 0 ${int(8, 16)}px; border-bottom: 1px solid ${line};`, b)
      const sel = int(0, 4)
      for (let i = 0; i < 8; i++) el('div', `padding: ${int(8, 12)}px 2px; white-space: nowrap; ${i === sel ? `border-bottom: 2px solid ${accent}; color: ${accent};` : 'opacity: 0.7;'}`, bar, pick(LABELS))
      const body = el('div', `padding: ${int(8, 16)}px; ${font(sans(), size)} line-height: ${Math.round(size * 1.5)}px;`, b)
      body.textContent = text(int(3, 10))
    },
    chat(b) {
      const size = int(12, 16)
      b.style.cssText += `display: flex; flex-direction: column; gap: ${int(6, 10)}px; padding: ${int(8, 16)}px; background: ${bg()}; ${font(sans(), size)} line-height: ${Math.round(size * 1.35)}px;`
      for (let i = 0; i < 14; i++) {
        const me = chance(0.5)
        el('div', `max-width: 75%; align-self: ${me ? 'flex-end' : 'flex-start'}; padding: ${int(5, 9)}px ${int(9, 14)}px; border-radius: ${int(10, 20)}px; ${me ? `background: ${accent}; color: #fff;` : `background: ${dark ? '#3a3a3c' : '#e9e9eb'}; color: ${fg()};`}`, b,
          sentence(int(2, 16)) + (chance(0.15) ? ' ' + pick(EMOJI) : ''))
        if (chance(0.2)) el('div', `align-self: center; ${font(sans(), size - 3, 500)} opacity: 0.5; color: ${fg()};`, b, `${pick(['Today', 'Yesterday', 'Monday'])} ${int(1, 12)}:${String(int(0, 59)).padStart(2, '0')}`)
      }
    },
    cards(b) {
      const size = int(11, 14)
      b.style.cssText += `display: flex; flex-wrap: wrap; align-content: flex-start; gap: ${int(8, 16)}px; padding: ${int(8, 16)}px; background: ${bg()}; color: ${fg()}; ${font(sans(), size)}`
      for (let i = 0; i < 12; i++) {
        const c = el('div', `width: ${int(120, 260)}px; padding: ${int(8, 14)}px; border-radius: ${int(6, 14)}px; background: ${dark ? '#ffffff0f' : '#fff'}; border: 1px solid ${line}; ${chance(0.4) ? `box-shadow: 0 1px ${int(2, 8)}px #00000026;` : ''}`, b)
        if (chance(0.4)) el('div', `height: ${int(30, 80)}px; margin: -4px -4px 8px; border-radius: ${int(4, 10)}px; background: linear-gradient(${int(0, 360)}deg, ${tint()}, ${tint()});`, c)
        el('div', `${font(sans(), int(12, 22), pick([600, 700]))} margin-bottom: 4px;`, c, chance(0.5) ? token() : cap(word()) + ' ' + word())
        el('div', `opacity: 0.7; line-height: ${Math.round(size * 1.4)}px;`, c, sentence(int(4, 12)))
      }
    },
    labels(b) {
      b.style.cssText += `padding: ${int(4, 12)}px; background: ${bg()}; color: ${fg()};`
      for (let i = 0; i < 80; i++) {
        const sz = int(8, 26)
        const s = el('span', `${font(chance(0.2) ? pick(SERIF) : chance(0.2) ? pick(MONO) : sans(), sz, pick([300, 400, 500, 600, 700, 800]))} margin-right: ${int(4, 14)}px; line-height: ${Math.round(sz * 1.5)}px; ${chance(0.2) ? `color: ${tint()};` : ''} ${chance(0.1) ? 'font-style: italic;' : ''} ${chance(0.06) ? 'text-decoration: underline;' : ''}`, b, chance(0.5) ? token() : chance(0.1) ? pick(EMOJI) : pick(LABELS))
        if (chance(0.1)) s.style.cssText += `padding: 1px 6px; border-radius: 99px; background: ${tint()}; color: #fff;`
      }
    },
    picture(b) {
      // Not everything on a screen is text: gradients, soft shapes, and noisy pictures, so the model leaves them alone.
      const c = el('canvas', 'width: 100%; height: 100%; display: block;', b)
      c.width = Math.max(1, Math.round(b.clientWidth * devicePixelRatio))
      c.height = Math.max(1, Math.round(b.clientHeight * devicePixelRatio))
      const g = c.getContext('2d')
      const lin = g.createLinearGradient(0, 0, c.width, c.height)
      lin.addColorStop(0, tint()); lin.addColorStop(1, tint())
      g.fillStyle = lin
      g.fillRect(0, 0, c.width, c.height)
      const k = devicePixelRatio
      for (let i = 0; i < 40; i++) {
        g.fillStyle = `hsla(${int(0, 359)} ${int(20, 90)}% ${int(20, 80)}% / ${(0.1 + rnd() * 0.5).toFixed(2)})`
        g.beginPath()
        g.ellipse(rnd() * c.width, rnd() * c.height, int(4, 120) * k, int(4, 120) * k, rnd() * 3, 0, 6.3)
        g.fill()
      }
      if (chance(0.5)) {
        // Texture sampled in CSS px, so it is the same picture at every density.
        const n = int(2, 6)
        for (let y = 0; y < c.height / k; y += n) for (let x = 0; x < c.width / k; x += n) {
          const v = Math.floor(rnd() * 60)
          g.fillStyle = `rgba(${v},${v},${v},${(rnd() * 0.25).toFixed(2)})`
          g.fillRect(x * k, y * k, n * k, n * k)
        }
      }
    },
  }
  const KINDS = Object.keys(W)
  const weights = { paragraph: 3, sidebar: 2, toolbar: 2, code: 3, table: 2, form: 2, menu: 1, tabs: 1, chat: 2, cards: 2, labels: 3, picture: 1 }
  const bag = KINDS.flatMap((k) => Array(weights[k]).fill(k))

  // Split the page into boxes, as a window splits into panes.
  const boxes = []
  const split = (x, y, w, h, depth) => {
    if (depth > 3 || w < 160 || h < 120 || (depth > 0 && chance(0.3))) { boxes.push([x, y, w, h]); return }
    if (w > h ? chance(0.75) : chance(0.25)) { const a = Math.round(w * (0.25 + rnd() * 0.5)); split(x, y, a, h, depth + 1); split(x + a, y, w - a, h, depth + 1) }
    else { const a = Math.round(h * (0.25 + rnd() * 0.5)); split(x, y, w, a, depth + 1); split(x, y + a, w, h - a, depth + 1) }
  }
  split(0, 0, width, height, 0)
  document.body.style.background = bg()
  for (const [x, y, w, h] of boxes) {
    const b = el('div', `left: ${x}px; top: ${y}px; width: ${w}px; height: ${h}px;`, document.body)
    b.className = 'leaf'
    W[pick(bag)](b)
  }
}
</script>
</body>
</html>
