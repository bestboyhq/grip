  .top{display:flex;align-items:center;gap:8px;font-size:15px;height:20px;font-weight:500;color:#ededef}
  .st{position:absolute;left:-20px;top:4px;width:10px;height:10px;border-radius:50%;background:#1fbf78}
  .mono{font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:14px;color:#9a9aa2}
  .msg{color:#c4c4c9;font-size:14.5px}

  .more{right:36px;top:0;height:76px;display:flex;align-items:center;color:#6b6b73;font-size:20px;letter-spacing:1px}
  .cur{display:inline-block;font-size:12.5px;font-weight:500;color:#c4c4c9;background:#26262a;padding:1px 7px;border-radius:5px;margin-left:8px}
</style></head><body>

<div class="btn" style="left:1157px;top:172px;width:98px"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#ededef" stroke-width="1.5" stroke-linecap="round"><path d="M2 4h12M4 8h8M6.5 12h3"/></svg>Filter</div>

<div class="field" style="left:825px;width:238px"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#9a9aa2" stroke-width="1.4" stroke-linecap="round"><rect x="1.8" y="3" width="12.4" height="11" rx="2"/><path d="M1.8 6.5h12.4M5 1.5v3M11 1.5v3"/></svg><span style="font-weight:400">Select Date Range</span></div>
<div class="field" style="left:1075px;width:178px;justify-content:space-between">All Environments<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#9a9aa2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m2.5 4.5 3.5 3.5 3.5-3.5"/></svg></div>
<div class="field" style="left:1264px;width:139px;justify-content:space-between"><span>Status <span class="mut" style="margin-left:5px">5/6</span></span><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#9a9aa2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m2.5 4.5 3.5 3.5 3.5-3.5"/></svg></div>
<div id="table"><div id="fresh" style="height:0;overflow:hidden"></div><div id="rows"></div></div>
<script>
  const S = JSON.parse(new URLSearchParams(location.search).get('s')) // { click: {down, up}, row, ready }
  const BR = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#9a9aa2" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="4" cy="3.5" r="1.7"/><circle cx="4" cy="12.5" r="1.7"/><circle cx="12" cy="5" r="1.7"/><path d="M4 5.2v5.6M12 6.7c0 3-3.5 2.2-8 4.3"/></svg>'
  const CM = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#6b6b73" stroke-width="1.4" stroke-linecap="round"><circle cx="8" cy="8" r="2.4"/><path d="M1 8h4.6M10.4 8H15"/></svg>'
  const DOTS = '<div class="more">···</div>'
  // [id, env, status text, branch, sha, message, when, who, initials]
  const DATA = [
    ['Hs4bT1cLe', 'Production', '41s (2h ago)', 'main', 'b4e81d2', 'fix(cart): keep coupon after sign-in', '2h ago by leopark', 'LP'],
    ['2pWq8ZnVd', 'Preview', '38s (5h ago)', 'feat/search-v2', '3a9c07f', 'search: debounce and highlight mat…', '5h ago by anaruiz', 'AR'],
    ['Lx7eR3uYk', 'Preview', '36s (1d ago)', 'deps/next-15', 'e07b9a1', 'chore(deps): bump next to 15.1.2', '1d ago by renovate[bot]', 'R'],
    ['Bv6nJ0tGa', 'Production', '44s (1d ago)', 'main', '91fd2c6', 'perf: cache product images at the e…', '1d ago by mayachen', 'MC'],
    ['Qm3hD9wPz', 'Preview', '33s (2d ago)', 'fix/og-image', '5d10b3e', 'fix: load OG image fonts once', '2d ago by jsmith', 'JS'],
    ['Tc8sK4yNf', 'Production', '39s (3d ago)', 'main', 'c2a7f08', 'feat: gift cards at checkout', '3d ago by leopark', 'LP'],
    ['Wd5gH2kRm', 'Preview', '40s (3d ago)', 'feat/gift-cards', '8e3f1b6', 'gift cards: balance check endpoint', '3d ago by anaruiz', 'AR'],
    ['Zr2nB8cTs', 'Preview', '37s (4d ago)', 'main', '0a6d5e2', 'docs: add shipping FAQ', '4d ago by jsmith', 'JS'],
  ]
  const row = (id, env, status, dot, br, sha, msg, when, ini, badge) => `<div class="row">
    <div class="c1"><b>${id}</b><div class="sub">${env}${badge ? '<span class="cur">Current</span>' : ''}</div></div>
    <div class="c2"><div class="st" style="background:${dot}"></div><div class="top">${status[0]}</div><div class="sub">${status[1]}</div></div>
    <div class="c3"><div class="top">${BR}${br}</div><div class="sub">${CM}<span class="mono">${sha}</span><span class="msg">${msg}</span></div></div>
    <div class="when">${when}</div><div class="abs av sm">${ini}</div>${DOTS}</div>`
  const rows = DATA.map((d, i) => row(d[0], d[1], ['Ready', d[2]], '#1fbf78', d[3], d[4], d[5], d[6], d[7], false)).join('')
  document.getElementById('rows').innerHTML = rows
  const rowsEl = document.getElementById('rows')
  rowsEl.firstElementChild.querySelector('.sub').insertAdjacentHTML('beforeend', '<span class="cur">Current</span>')
  const ease = (p) => 1 - (1 - p) ** 3
  const SPIN = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#0b0b0c" stroke-width="1.8" stroke-linecap="round"><circle cx="8" cy="8" r="6" stroke-opacity=".25"/><path id="arc" d="M8 2a6 6 0 0 1 6 6"/></svg>'
  const UP = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#0b0b0c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 11V2.5M4.5 5.5 8 2l3.5 3.5M2.5 10v3.5h11V10"/></svg>'
  let last = ''
  window.render = (t) => {
    const deploying = t >= S.click.down && t < S.ready
    const btn = document.getElementById('deploy')
    const html = deploying ? SPIN + 'Deploying' : UP + 'Deploy'
    if (html !== last) { btn.innerHTML = html; last = html }
    btn.style.background = deploying ? '#b8b8bd' : '#ededef'
    btn.style.borderColor = btn.style.background
    btn.style.transform = t >= S.click.down && t < S.click.up ? 'scale(.97)' : ''
    const arc = document.getElementById('arc'); if (arc) arc.parentNode.style.transform = `rotate(${t * 540}deg)`
    const p = ease(Math.max(0, Math.min(1, (t - S.row) / 0.55)))
    const fresh = document.getElementById('fresh')
    if (p > 0) {
      const ready = t >= S.ready
      const secs = Math.min(11, 9 + Math.floor((t - S.row) / 0.8))
      fresh.innerHTML = row('9fK2mQx7r', 'Production', ready ? ['Ready', '12s (just now)'] : ['Building', secs + 's'], ready ? '#1fbf78' : '#f5a623', 'main', '7c1e4a9', 'feat(checkout): one-tap Apple Pay', 'just now by mayachen', 'MC', ready)
      fresh.style.height = 81.3 * p + 'px'
      fresh.style.opacity = String(p)
      rowsEl.firstElementChild.querySelector('.cur')?.remove()
      if (!ready) rowsEl.firstElementChild.querySelector('.sub').insertAdjacentHTML('beforeend', '<span class="cur">Current</span>')
    } else fresh.style.height = '0'
  }
</script></body></html>
