<!doctype html>
<!-- The launch checklist from the README captions demo. render(t) draws the state at time t.
     No cursor: like a real capture, Grip draws it later from events. -->
<html><head><meta charset="utf-8"><style>
  :root{color-scheme:light dark}
  *{box-sizing:border-box}
  html,body{margin:0;width:1280px;height:800px;overflow:hidden;background:light-dark(#fff,#0b0b0c);color:light-dark(#171717,#ededef);font:15px/1.3 -apple-system,'SF Pro Text',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  svg{display:block;flex:none}
  .abs{position:absolute;display:flex;align-items:center;white-space:nowrap}
  aside{position:absolute;left:0;top:0;width:248px;height:800px;background:light-dark(#fafafa,#141416);border-right:1px solid light-dark(#ebebeb,#202023)}
  .dot{width:12px;height:12px;border-radius:50%}
  .item{position:absolute;left:8px;width:231px;height:30px;margin-top:-15px;border-radius:6px;display:flex;align-items:center;color:light-dark(#525252,#c4c4c9);font-size:14.5px;white-space:nowrap}
  .item.on{background:light-dark(#ededed,#1c1c1f);color:light-dark(#171717,#ededef);font-weight:500}
  .item>*{position:absolute}
  .label{position:absolute;left:20px;margin-top:-8px;font-size:12px;font-weight:500;color:light-dark(#8f8f8f,#9a9aa2);letter-spacing:.1px}
  .av{border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;letter-spacing:.2px}
  .mc{background:linear-gradient(135deg,#ff9a56,#f0603e)}.lp{background:linear-gradient(135deg,#a1a1aa,#52525b)}.ps{background:linear-gradient(135deg,#d9b48a,#9c6b45)}
  .prop{position:absolute;left:410px;width:707px;height:36px;margin-top:-18px;display:flex;align-items:center}
  .prop .k{display:flex;align-items:center;gap:10px;width:198px;padding-left:10px;color:light-dark(#666,#9a9aa2)}
  .prop .v{display:flex;align-items:center;gap:8px}
  #pill{height:24px;padding:0 10px 0 9px;border-radius:12px;display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:500}
  #pill i{width:7px;height:7px;border-radius:50%}
  .row{position:absolute;left:360px;width:757px;height:36px;margin-top:-18px}
  .row>*{position:absolute}
  .hov{left:48px;top:5px;width:26px;height:26px;border-radius:6px;background:light-dark(#efefef,#1c1c1f)}
  .box{left:52px;top:9px;width:18px;height:18px;border-radius:4.5px;border:1.5px solid light-dark(#a1a1a1,#5c5c64);background:light-dark(#fff,#141416)}
  .box svg{position:absolute;left:-1.5px;top:-1.5px}
  .txt{left:81px;top:0;height:36px;display:flex;align-items:center;gap:8px;font-size:16px;white-space:nowrap}
  .who{font-size:15px;color:light-dark(#8f8f8f,#9a9aa2)}
  .strike{position:absolute;left:0;top:18.5px;height:1px;background:light-dark(#a3a3a3,#6b6b73)}
  .grip{top:10px;display:flex;gap:2px}
</style></head><body>
<aside>
  <div class="abs dot" style="left:19px;top:17px;background:#ff5f57"></div><div class="abs dot" style="left:39px;top:17px;background:#febc2e"></div><div class="abs dot" style="left:59px;top:17px;background:#28c840"></div>
  <div class="abs" style="left:16px;top:51px;width:22px;height:22px;border-radius:6px;background:light-dark(#171717,#ededef);justify-content:center"><svg width="12" height="12" viewBox="0 0 12 12" fill="light-dark(#fff,#0b0b0c)"><path d="M1 11 6 1l5 10H8.4L6 6 3.6 11Z"/></svg></div>
  <div class="abs" style="left:46px;top:52px;height:20px;gap:6px;font-size:15px;font-weight:600">Fernhill<svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="light-dark(#8f8f8f,#6b6b73)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="m2 3.8 3 3 3-3"/></svg></div>
  <div id="nav"></div>
</aside>
<div class="abs" style="left:265px;top:15px;gap:8px" id="arrows"></div>
<div class="abs" style="left:322px;top:13px;height:20px;gap:6px;font-size:14.5px;color:light-dark(#525252,#c4c4c9)" id="crumbs"></div>
<div class="abs" style="right:14px;top:9px;height:28px;gap:16px" id="tools"></div>
<div style="position:absolute;left:248px;top:46px;width:1032px;height:90px;background:radial-gradient(60% 140% at 22% 0%,light-dark(rgba(255,255,255,.45),rgba(255,150,108,.12)),transparent 70%),linear-gradient(100deg,light-dark(#f7c9ae,#4a2618) 0%,light-dark(#f4d2b8,#402619) 32%,light-dark(#f1dcc6,#34241b) 60%,light-dark(#efe5d8,#28211d) 85%,light-dark(#f2ece4,#201e1d) 100%)"></div>
<div class="abs" id="icon" style="left:410px;top:100px;width:60px;height:60px;border-radius:14px;background:light-dark(#fff,#141416);border:1px solid light-dark(#ebebeb,#2a2a2e);box-shadow:0 1px 2px light-dark(rgba(0,0,0,.05),rgba(0,0,0,.4)),0 4px 12px light-dark(rgba(0,0,0,.05),rgba(0,0,0,.35));justify-content:center"></div>
<div class="abs" style="left:409px;top:176px;height:48px;font-size:40px;font-weight:700;letter-spacing:-.9px">Relay 2.0 launch</div>
<div id="props"></div>
<div style="position:absolute;left:410px;top:392px;width:707px;height:1px;background:light-dark(#ebebeb,#202023)"></div>
<div class="abs" style="left:410px;top:409px;height:28px;font-size:21px;font-weight:650;letter-spacing:-.3px">Launch day</div>
<div id="list"></div>
<script>
  const S = JSON.parse(new URLSearchParams(location.search).get('s')) // { checks, press, live, hover: [t, row, onBox][] }
  // 24-unit line icons (paths in the common open icon style), drawn at `size` px.
  const icon = (paths, size = 16, color = 'light-dark(#8a8a8a,#6b6b73)', width = 2) =>
    `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" color="${color}" stroke="${color}" stroke-width="${width}" stroke-linecap="round" stroke-linejoin="round">${paths.map((d) => (d[0] === '<' ? d : `<path d="${d}"/>`)).join('')}</svg>`
  const P = {
    search: ['<circle cx="11" cy="11" r="7"/>', 'm20 20-3.8-3.8'],
    home: ['M3.5 10.2 12 3.5l8.5 6.7V19a1.5 1.5 0 0 1-1.5 1.5h-4.5v-6h-5v6H5A1.5 1.5 0 0 1 3.5 19Z'],
    inbox: ['M22 12h-6l-2 3h-4l-2-3H2', 'M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11Z'],
    megaphone: ['m3 11 18-5v12L3 14v-3Z', 'M11.6 16.8a3 3 0 1 1-5.8-1.6'],
    rocket: ['M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09Z', 'm12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2Z', 'M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0', 'M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5'],
    file: ['M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z', 'M14 2v4a2 2 0 0 0 2 2h4', 'M16 13H8', 'M16 17H8', 'M10 9H8'],
    video: ['m16 13 5.22 3.48a.5.5 0 0 0 .78-.41V7.87a.5.5 0 0 0-.75-.43L16 10.5', '<rect x="2" y="6" width="14" height="12" rx="2"/>'],
    tag: ['M12.59 2.59A2 2 0 0 0 11.17 2H4a2 2 0 0 0-2 2v7.17a2 2 0 0 0 .59 1.42l8.7 8.7a2.43 2.43 0 0 0 3.42 0l6.58-6.58a2.43 2.43 0 0 0 0-3.42Z', '<circle cx="7.5" cy="7.5" r=".6" fill="currentColor"/>'],
    map: ['M14.1 5.55a2 2 0 0 0 1.8 0l3.66-1.83A1 1 0 0 1 21 4.62v12.76a1 1 0 0 1-.55.9l-4.56 2.27a2 2 0 0 1-1.78 0l-4.22-2.1a2 2 0 0 0-1.78 0l-3.66 1.83A1 1 0 0 1 3 19.38V6.62a1 1 0 0 1 .55-.9l4.56-2.27a2 2 0 0 1 1.78 0Z', 'M15 5.76v15', 'M9 3.24v15'],
    pen: ['M12 20h9', 'M16.38 3.62a2.12 2.12 0 0 1 3 3L7.37 18.64a2 2 0 0 1-.86.5l-2.87.84a.5.5 0 0 1-.62-.62l.84-2.87a2 2 0 0 1 .5-.85Z'],
    book: ['M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20'],
    calendar: ['<rect x="3" y="4" width="18" height="18" rx="2"/>', 'M16 2v4', 'M8 2v4', 'M3 10h18'],
    bookmark: ['m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2Z'],
    user: ['M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2', '<circle cx="12" cy="7" r="4"/>'],
    status: ['<circle cx="12" cy="12" r="9"/>', '<circle cx="12" cy="12" r="3"/>'],
    chart: ['M3 20.5h18', 'M7 16.5v-4', 'M12 16.5V7', 'M17 16.5v-7'],
    left: ['m15 18-6-6 6-6'], right: ['m9 18 6-6-6-6'],
    comment: ['M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2Z'],
    star: ['M11.53 2.3a.53.53 0 0 1 .95 0l2.31 4.68a2.12 2.12 0 0 0 1.6 1.16l5.16.75a.53.53 0 0 1 .3.91l-3.74 3.64a2.12 2.12 0 0 0-.61 1.88l.88 5.14a.53.53 0 0 1-.77.56l-4.62-2.43a2.12 2.12 0 0 0-1.97 0L6.4 21.01a.53.53 0 0 1-.77-.56l.88-5.14a2.12 2.12 0 0 0-.61-1.88L2.16 9.8a.53.53 0 0 1 .3-.91l5.16-.75a2.12 2.12 0 0 0 1.6-1.16Z'],
    plus: ['M5 12h14', 'M12 5v14'],
  }
  const tri = (open) => `<svg width="10" height="10" viewBox="0 0 10 10" fill="light-dark(#a3a3a3,#6b6b73)" style="${open ? 'transform:rotate(90deg)' : ''}"><path d="M3.5 2.2v5.6L7.7 5Z"/></svg>`
  const dots = (n) => `<svg width="${n === 3 ? 16 : 10}" height="16" viewBox="0 0 ${n === 3 ? 16 : 10} 16" fill="light-dark(#9a9a9a,#6b6b73)">${Array.from({ length: n === 3 ? 3 : 6 }, (_, i) => n === 3 ? `<circle cx="${2.5 + i * 5.5}" cy="8" r="1.4"/>` : `<circle cx="${3 + (i % 2) * 4}" cy="${4 + Math.floor(i / 2) * 4}" r="1.2"/>`).join('')}</svg>`
  const av = (cls, ini, size, font, ring) => `<div class="av ${cls}" style="width:${size}px;height:${size}px;font-size:${font}px;${ring ? 'box-shadow:0 0 0 2px light-dark(#fff,#0b0b0c);' : ''}">${ini}</div>`

  // Sidebar: [y, kind, name, icon] with kind n = nav, t = top-level page (open?), c = child page, l = label.
  const NAV = [
    [93, 'n', 'Search', 'search'], [123, 'n', 'Home', 'home'], [153, 'n', 'Inbox', 'inbox'],
    [194, 'l', 'Teamspaces'],
    [220, 't', 'Launches', 'megaphone', true], [250, 'c', 'Relay 2.0 launch', 'rocket'], [280, 'c', 'Release notes', 'file'], [310, 'c', 'Demo script', 'video'], [340, 'c', 'Pricing experiments', 'tag'],
    [370, 't', 'Roadmap', 'map'], [400, 't', 'Design reviews', 'pen'], [430, 't', 'Engineering wiki', 'book'],
    [469, 'l', 'Private'],
    [495, 't', 'Weekly notes', 'calendar'], [525, 't', 'Reading list', 'bookmark'],
  ]
  document.getElementById('nav').innerHTML = NAV.map(([y, kind, name, ic, open]) => {
    if (kind === 'l') return `<div class="label" style="top:${y}px">${name}</div>`
    const on = name === 'Relay 2.0 launch'
    const x = kind === 'n' ? [null, 12, 38] : kind === 't' ? [8, 26, 54] : [null, 31, 59]
    return `<div class="item${on ? ' on' : ''}" style="top:${y}px">${x[0] === null ? '' : `<span style="left:${x[0]}px">${tri(open)}</span>`}<span style="left:${x[1]}px">${icon(P[ic], 16, on ? 'light-dark(#525252,#c4c4c9)' : 'light-dark(#8a8a8a,#6b6b73)')}</span><span style="left:${x[2]}px">${name}</span></div>`
  }).join('')

  document.getElementById('arrows').innerHTML = icon(P.left, 16, 'light-dark(#8a8a8a,#9a9aa2)') + icon(P.right, 16, 'light-dark(#c4c4c4,#46464d)')
  document.getElementById('crumbs').innerHTML = `${icon(P.megaphone, 15, 'light-dark(#8a8a8a,#6b6b73)')}Launches<span style="color:light-dark(#c8c8c8,#46464d);margin:0 4px">/</span>${icon(P.rocket, 15, 'light-dark(#525252,#c4c4c9)')}<span style="color:light-dark(#171717,#ededef)">Relay 2.0 launch</span>`
  document.getElementById('tools').innerHTML = `<span style="font-size:13.5px;color:light-dark(#8f8f8f,#9a9aa2)">Edited just now</span>
    <div style="display:flex;gap:0">${av('mc', 'MC', 24, 9, 1)}<div style="margin-left:-2px">${av('lp', 'LP', 24, 9, 1)}</div><div style="margin-left:-2px">${av('ps', 'PS', 24, 9, 1)}</div></div>
    <span style="font-size:14.5px;font-weight:500">Share</span>${icon(P.comment, 17, 'light-dark(#666,#9a9aa2)', 1.8)}${icon(P.star, 17, 'light-dark(#666,#9a9aa2)', 1.8)}${dots(3)}`
  document.getElementById('icon').innerHTML = icon(P.rocket, 30, 'light-dark(#171717,#ededef)', 1.7)

  document.getElementById('props').innerHTML = [
    [254, 'calendar', 'Launch date', 'October 21, 2026'],
    [290, 'user', 'Owner', `${av('mc', 'MC', 22, 9)}Maya Chen`],
    [326, 'status', 'Status', '<div id="pill"></div>'],
    [362, 'chart', 'Progress', '<div style="position:relative;width:209px;height:6px;border-radius:3px;background:light-dark(#ebebeb,#26262a);overflow:hidden"><div id="bar" style="height:6px;background:light-dark(#171717,#ededef);border-radius:3px"></div></div><span id="pct" style="margin-left:4px;color:light-dark(#666,#9a9aa2);font-variant-numeric:tabular-nums"></span>'],
  ].map(([y, ic, k, v]) => `<div class="prop" style="top:${y}px"><div class="k">${icon(P[ic], 16, 'light-dark(#8a8a8a,#6b6b73)', 1.8)}${k}</div><div class="v">${v}</div></div>`).join('')

  // The checklist: rows 0 and 1 are done before the take; rows 2-5 are checked at S.checks.
  const ROWS = [
    ['Freeze the release branch', 'Leo Park'],
    ['Final QA pass on desktop and mobile', 'Priya Shah'],
    ['Write the changelog for 2.0', 'Maya Chen'],
    ['Record the 60-second demo video', 'Sam Okafor'],
    ['Update the pricing page and FAQ', 'Maya Chen'],
    ['Go live', 'Leo Park'],
  ]
  const CHECK = '<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="light-dark(#fff,#0b0b0c)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path pathLength="1" stroke-dasharray="1" d="m4.8 9.3 2.8 2.8 5.6-6.1"/></svg>'
  document.getElementById('list').innerHTML = ROWS.map(([what, who], i) => `<div class="row" style="top:${459 + 36 * i}px">
    <span class="grip" style="left:2px">${icon(P.plus, 16, 'light-dark(#a3a3a3,#6b6b73)', 1.8)}</span><span class="grip" style="left:22px">${dots(6)}</span>
    <div class="hov"></div><div class="box">${CHECK}</div>
    <div class="txt"><span class="what">${what}</span><span class="who">@${who}</span><i class="strike"></i></div></div>`).join('')
  const rows = [...document.querySelectorAll('.row')]

  const clamp = (v) => Math.min(1, Math.max(0, v))
  const ease = (p) => 1 - (1 - p) ** 3
  const mix = (a, b, p) => `color-mix(in srgb, ${a}, ${b} ${p * 100}%)`
  const checkedAt = [-Infinity, -Infinity, ...S.checks]

  window.render = (t) => {
    let h = 0
    while (h + 1 < S.hover.length && S.hover[h + 1][0] <= t) h++
    const [, hoverRow, onBox] = S.hover[h]
    rows.forEach((row, i) => {
      const at = checkedAt[i]
      const p = ease(clamp((t - at) / 0.18)) // check draws in
      const q = ease(clamp((t - at) / 0.3)) // text greys out and is struck through
      const box = row.querySelector('.box')
      box.style.background = t >= at ? 'light-dark(#171717,#ededef)' : 'light-dark(#fff,#141416)'
      box.style.borderColor = t >= at ? 'light-dark(#171717,#ededef)' : 'light-dark(#a1a1a1,#5c5c64)'
      box.querySelector('path').style.strokeDashoffset = String(1 - p)
      box.style.transform = t >= at && t < at + S.press ? 'scale(.9)' : ''
      const txt = row.querySelector('.txt')
      txt.querySelector('.what').style.color = mix('light-dark(#171717,#ededef)', 'light-dark(#a3a3a3,#6b6b73)', q)
      txt.querySelector('.who').style.color = mix('light-dark(#8f8f8f,#9a9aa2)', 'light-dark(#c4c4c4,#505058)', q)
      txt.querySelector('.strike').style.width = txt.offsetWidth * q + 'px'
      row.querySelector('.hov').style.opacity = i === hoverRow && onBox ? '1' : '0'
      row.querySelectorAll('.grip').forEach((g) => (g.style.opacity = i === hoverRow ? '1' : '0'))
    })
    // Progress: two of six done before the take; the bar eases to each new count, the label jumps.
    const done = 2 + S.checks.reduce((n, c) => n + ease(clamp((t - c) / 0.45)), 0)
    document.getElementById('bar').style.width = (209 * done) / 6 + 'px'
    document.getElementById('pct').textContent = Math.round((100 * (2 + S.checks.filter((c) => t >= c).length)) / 6) + '%'
    const live = t >= S.live
    const pill = document.getElementById('pill')
    const html = live ? '<i style="background:light-dark(#10b36b,#22c47e)"></i>Live' : '<i style="background:#f5a623"></i>In progress'
    if (pill.innerHTML !== html) pill.innerHTML = html
    pill.style.background = live ? 'light-dark(#e6f6ee,rgba(34,196,126,.16))' : 'light-dark(#f4f4f5,#26262a)'
    pill.style.color = live ? 'light-dark(#107a4b,#6ee0a8)' : 'light-dark(#3f3f46,#c4c4c9)'
    pill.style.transform = `scale(${live ? 0.94 + 0.06 * ease(clamp((t - S.live) / 0.2)) : 1})`
  }
</script></body></html>
