<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Studio app icon. macOS grid: an 824 px body centered on the 1024 px canvas. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a8cff"/>
      <stop offset="0.55" stop-color="#6650ee"/>
      <stop offset="1" stop-color="#3a27a8"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="dot" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ff8a80"/>
      <stop offset="1" stop-color="#ff3b30"/>
    </radialGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1a0f5c" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#body)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sheen)"/>
  <rect x="101" y="101" width="822" height="822" rx="185" fill="none" stroke="#fff" stroke-opacity="0.18" stroke-width="2"/>
  <g filter="url(#drop)">
    <!-- the screen -->
    <rect x="236" y="262" width="552" height="384" rx="54" fill="#fff" fill-opacity="0.12" stroke="#fff" stroke-width="38"/>
    <path d="M430 760h164M512 646v114" stroke="#fff" stroke-width="38" stroke-linecap="round"/>
    <!-- recording -->
    <circle cx="512" cy="454" r="124" fill="#fff" fill-opacity="0.16"/>
    <circle cx="512" cy="454" r="84" fill="url(#dot)"/>
  </g>
</svg>
