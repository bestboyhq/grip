name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A release in progress must finish; a newer merge waits and releases after it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Three jobs in parallel; each skips or restores whatever its inputs leave unchanged.
  check:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx vite build

  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - id: image
        run: echo "id=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      # The addon is a function of its sources and the runner image (Xcode, SDK): rebuilt only when they change.
      - id: native
        uses: actions/cache@v4
        with:
          path: native/studio.darwin-arm64.node
          key: native-${{ steps.image.outputs.id }}-${{ hashFiles('native/src/**', 'native/Cargo.*', 'native/build.rs') }}
      - if: steps.native.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          key: macos-26 # build scripts cache Xcode paths: a new runner image needs a new cache
      - run: npm ci
      - if: steps.native.outputs.cache-hit != 'true'
        run: npm run build:native
      - run: brew install ffmpeg
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ hashFiles('node_modules/electron/package.json') }}
      # The synthetic recording takes a minute to render: regenerated only when its generator changes.
      # Saved without the bundle's cache/ (waveforms the tests write), so every run tests writing it.
      - id: fixture
        uses: actions/cache@v4
        with:
          path: |
            .context/fixtures
            !.context/fixtures/*.grip/cache
          key: fixture-${{ steps.image.outputs.id }}-${{ hashFiles('scripts/fixture/**', 'src/shared/project.ts', 'src/shared/events.ts') }}
      - if: steps.fixture.outputs.cache-hit != 'true'
        run: npx electron scripts/fixture/make.ts
      - run: npm test

  rust:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - id: image
        run: echo "id=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      # The addon's tests take two minutes (an hour of video through the encoder): a green run of the same
      # sources on the same image leaves a marker, and later runs skip them.
      - id: tested
        uses: actions/cache/restore@v4
        with:
          path: native/.tested
          key: rust-tested-${{ steps.image.outputs.id }}-${{ hashFiles('native/src/**', 'native/Cargo.*', 'native/build.rs') }}
          lookup-only: true
      - if: steps.tested.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          key: macos-26 # build scripts cache Xcode paths: a new runner image needs a new cache
      - if: steps.tested.outputs.cache-hit != 'true'
        run: brew install ffmpeg # the capture tests probe what they record
      - if: steps.tested.outputs.cache-hit != 'true'
        run: cargo test && touch .tested
        working-directory: native
      - if: steps.tested.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: native/.tested
          key: ${{ steps.tested.outputs.cache-primary-key }}

  # The version the merged commits call for; empty when none of them is a feat, fix, perf, or breaking change.
  version:
    needs: [check, test, rust]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      next: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the tags and commits since the last release
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - id: next
        run: echo "version=$(node scripts/version.ts)" >> "$GITHUB_OUTPUT"

  # Ships the merge as an in-app update: users get it on their next update check.
  release:
    needs: version
    if: needs.version.outputs.next != ''
    runs-on: macos-26
    permissions:
      contents: write
    env:
      V: ${{ needs.version.outputs.next }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          key: macos-26 # build scripts cache Xcode paths: a new runner image needs a new cache
      - run: npm ci
      - name: Import the Developer ID certificate
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db" pw=$(openssl rand -base64 24)
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          printf '%s' "$CSC_LINK" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CSC_KEY_PASSWORD" -A -t cert -f pkcs12 -k "$kc"
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$pw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - run: npm version "$V" --no-git-tag-version
      - run: xcrun notarytool store-credentials grip --apple-id "$APPLE_ID" --team-id 59F3NS99CS --password "$APPLE_APP_SPECIFIC_PASSWORD"
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      - run: npm run package
        env:
          APPLE_KEYCHAIN_PROFILE: grip
      - run: node scripts/update-e2e.ts
      - run: gh release create "v$V" --generate-notes --target "$GITHUB_SHA" release/Grip-$V-arm64* release/latest-mac.yml
        env:
          GH_TOKEN: ${{ github.token }}
