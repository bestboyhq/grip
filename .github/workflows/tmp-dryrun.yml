name: tmp release dry run
on:
  push:
    branches: [szymeo/github-actions-automation-v2]
jobs:
  dry:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - run: npm ci
      - name: Import the Developer ID certificate
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db" pw=$(openssl rand -base64 24)
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          printf '%s' "$CSC_LINK" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CSC_KEY_PASSWORD" -A -t cert -f pkcs12 -k "$kc"
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$pw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - run: npm version 0.1.0 --no-git-tag-version
      - run: npm run package
      - run: codesign -dv --verbose=2 release/mac-arm64/Grip.app 2>&1 | grep -E "Authority|TeamIdentifier"
      - run: node scripts/update-e2e.ts
      - if: failure()
        run: screencapture -x /tmp/screen.png || true
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screen
          path: /tmp/screen.png
