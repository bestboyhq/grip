name: CLA

# Every pull request author signs CLA.md once, by a comment on the pull request. Signatures live in
# signatures/cla.json on the cla-signatures branch, apart from main so its protection never blocks them.
# pull_request_target runs this file from main with a write token: it must never check out pull request code.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, reopened, synchronize] # reopened also unlocks a pull request locked on a close

permissions:
  actions: write # reruns the check once everyone has signed
  contents: write # commits signatures
  pull-requests: write # comments, and locks the conversation after a merge so signatures stay
  statuses: write

jobs:
  cla:
    # The action fails a pull request whose opener wrote none of its commits, which is every one szymeo opens: their
    # commits are by malini-agent[bot]. So those skip the job, and a skipped job still passes a required check.
    # The action takes the signing phrase with a short remark beside it, so only recheck must match exactly.
    if: >-
      (github.event.pull_request.user.login || github.event.issue.user.login) != 'szymeo' &&
      (github.event_name == 'pull_request_target' || (github.event.issue.pull_request && (github.event.comment.body == 'recheck' ||
      contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA'))))
    runs-on: ubuntu-latest
    steps:
      # The action never creates a missing branch, and it creates a missing file but fails that run,
      # so this step creates both first: a branch with a history of its own.
      - name: Create the signatures file
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          branch=cla-signatures file=signatures/cla.json empty='{"signedContributors": []}'
          gh api "repos/$GH_REPO/contents/$file?ref=$branch" --silent 2>/dev/null && exit 0
          if gh api "repos/$GH_REPO/branches/$branch" --silent 2>/dev/null; then
            gh api -X PUT "repos/$GH_REPO/contents/$file" -f branch="$branch" -f message="Create the CLA signatures file" -f content="$(printf '%s' "$empty" | base64)" --silent
          else
            tree=$(jq -n --arg path "$file" --arg content "$empty" '{tree: [{path: $path, mode: "100644", type: "blob", content: $content}]}' | gh api "repos/$GH_REPO/git/trees" --input - --jq .sha)
            commit=$(gh api "repos/$GH_REPO/git/commits" -f message="Start the CLA signatures" -f tree="$tree" --jq .sha)
            gh api "repos/$GH_REPO/git/refs" -f ref="refs/heads/$branch" -f sha="$commit" --silent
          fi
      # A Node 24 fork of the archived contributor-assistant/github-action, with the same inputs; its bundle at this
      # pin is byte-identical to a build of its source. Its owner keeps it for their own use with no support, so
      # read its CHANGELOG.md and the diff to the new commit before moving the pin.
      - uses: iainmcgin/cla-github-action@0d27e5a16278d4adb6b0c4b92f08ad27b0a21dc8 # v3.2.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          path-to-document: https://github.com/bestboyhq/grip/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          # Every Co-authored-by identity signs too, and an AI can't, so AI co-authors are listed by name or email.
          allowlist: szymeo,*[bot],Copilot,noreply@anthropic.com,cursoragent@cursor.com,noreply@cursor.com
